name: bugbot

on:
  workflow_dispatch:
    inputs:
      bug_description:
        required: true
        type: string
      telegram_chat_id:
        required: true
        type: string

jobs:
  fix:
    # Replace BenEliyahu with your GitHub username/org if different.
    uses: BenEliyahu/claude-bugbot/.github/workflows/reusable-fix.yml@main
    with:
      bug_description: ${{ inputs.bug_description }}
      telegram_chat_id: ${{ inputs.telegram_chat_id }}
      # Uncomment and adjust if this project doesn't use `npm run dev` on :3000
      # dev_url: "http://localhost:5173"
      # dev_command: "npm run dev"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      BUGBOT_INTERNAL_SECRET: ${{ secrets.BUGBOT_INTERNAL_SECRET }}
      BUGBOT_WORKER_URL: ${{ secrets.BUGBOT_WORKER_URL }}
